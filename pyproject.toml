[project]
name = "nai-artists"
version = "0.1.0"
description = "Test NovelAI Diffusion V5 artist: tags across a fixed matrix of subject templates."
requires-python = ">=3.12"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "pillow>=10",
    "python-dotenv>=1.0",
    "pyyaml>=6",
    "python-multipart>=0.0.32",
]

[project.scripts]
nai = "nai_artists.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["uv_build>=0.8"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""

[tool.pytest.ini_options]
testpaths = ["tests"]
